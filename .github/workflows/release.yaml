name: Release to Hackage

on:
  push:
    branches:
      - master

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  next-release:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.next-release.outputs.ready }}
      version: ${{ steps.next-release.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - id: next-release
        uses: nikita-volkov/changelog-driven-release.github-action@v1

  build:
    needs: next-release
    if: needs.next-release.outputs.ready == 'true'
    uses: ./.github/workflows/check.yaml
    secrets: inherit

  release:
    needs:
      - next-release
      - build
    runs-on: ubuntu-latest
    environment:
      name: hackage
      url: ${{ steps.generate-hackage-url.outputs.url }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Set package version
        uses: nikita-volkov/edit-cabal-version.github-action@v1
        with:
          mode: set
          set-value: ${{ needs.next-release.outputs.version }}

      - name: Prepend a fresh Upcoming section to the changelog
        run: |
          set -euo pipefail
          printf '# Upcoming\n\n' | cat - CHANGELOG.md > CHANGELOG.md.new
          mv CHANGELOG.md.new CHANGELOG.md

      - name: Extract package name and generate Hackage URL
        id: generate-hackage-url
        run: |
          cabal_file=$(find . -maxdepth 1 -name "*.cabal" -print -quit)
          package_name=$(awk -F ":[[:space:]]*" 'tolower($1)=="name" { gsub(/^[[:space:]]+|[[:space:]]+$/, "", $2); print $2 }' < "$cabal_file")
          echo "url=https://hackage.haskell.org/package/${package_name}-${{ needs.next-release.outputs.version }}" >> "${GITHUB_OUTPUT}"

      - name: Generate package dist
        run: cabal sdist

      - name: Publish on Hackage
        uses: haskell-actions/hackage-publish@v1.1
        with:
          hackageToken: ${{ secrets.HACKAGE_TOKEN }}
          publish: true

      - name: Commit the version update
        id: commit
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Set package version to ${{ needs.next-release.outputs.version }}
          file_pattern: "*.cabal CHANGELOG.md"

      - name: Create release tag
        uses: mathieudutour/github-tag-action@v6.1
        with:
          github_token: ${{ github.token }}
          custom_tag: ${{ needs.next-release.outputs.version }}
          tag_prefix: v
          commit_sha: ${{ steps.commit.outputs.commit_hash }}
